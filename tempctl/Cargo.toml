[package]
name = "tempctl"
version = "0.1.0"
edition = "2021"
description = "harness_mini 临时空间的独立 CLI：为 AI 自举开发提供隔离改动 + 手动合并"

[[bin]]
name = "tempctl"
path = "src/main.rs"

# 版本与 src-tauri/Cargo.lock 完全一致，可在离线环境（--offline）下编译，
# 不引入任何新依赖，也不影响主项目的依赖解析。
[dependencies]
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
similar = "=2.7.0"
walkdir = "=2.5.0"
ignore = "=0.4.33"
uuid = { version = "=1.26.1", features = ["v4"] }
